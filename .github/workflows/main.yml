name: Build EXE for Windows
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        pip install pyinstaller pywin32
    - name: Build EXE
      run: |
        pyinstaller --onefile --console --name "Emannur 的重命名工具" rename.py
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: my-exe-file
        path: dist/Emannur 的重命名工具.exe
